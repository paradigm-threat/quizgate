name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (packs + unit)
    # Pin away from ubuntu-latest → 26 surprise; matches current green runner family.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Regression suite
        run: ./scripts/run_regression.sh

  android-apk:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: [regression]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install platform and build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Build APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ./scripts/build_apk.sh
      - name: Upload QuizGate.apk
        uses: actions/upload-artifact@v7
        with:
          name: QuizGate.apk
          path: build/apk/QuizGate.apk
          if-no-files-found: error

  ios-stub:
    name: iOS stub
    # macos-14 not available on this org's Actions plan; macos-latest works for the stub.
    runs-on: macos-latest
    needs: [regression]
    steps:
      - uses: actions/checkout@v5
      - name: Build QuizGateStub
        working-directory: ios/QuizGateStub
        run: |
          xcodebuild \
            -project QuizGateStub.xcodeproj \
            -scheme QuizGateStub \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
