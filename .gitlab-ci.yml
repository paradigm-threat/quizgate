# Mirror of GitHub Actions CI for clevertree/quizgate.
# Device e2e (scripts/e2e_phone.sh) stays manual — needs a physical SERIAL.
#
# CI DISABLED (quota): workflow never runs. Jobs below kept for history.
# Re-enable: replace the `when: never` rule with the previous triggers:
#   - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#   - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#   - if: $CI_PIPELINE_SOURCE == "web"

workflow:
  rules:
    - when: never

stages:
  - test
  - build

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

regression:
  stage: test
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 > /dev/null
    - java -version
    - python3 --version
    - chmod +x scripts/*.sh
  script:
    - ./scripts/run_regression.sh

android-apk:
  stage: build
  image: eclipse-temurin:17-jdk
  needs: [regression]
  before_script:
    - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wget unzip zip curl python3 > /dev/null
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - |
      set -euo pipefail
      TMP="$(mktemp -d)"
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O "$TMP/cmdtools.zip"
      unzip -q "$TMP/cmdtools.zip" -d "$TMP"
      rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      mv "$TMP"/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
      rm -rf "$TMP"
      # Stay in project dir — GitLab keeps one shell across script lines
      cd "$CI_PROJECT_DIR"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
    - yes | sdkmanager --licenses >/dev/null || true
    - sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
    - cd "$CI_PROJECT_DIR"
  script:
    - cd "$CI_PROJECT_DIR"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/build-tools/34.0.0:$PATH"
    - chmod +x scripts/*.sh
    - ./scripts/build_apk.sh
  artifacts:
    name: "QuizGate-$CI_COMMIT_SHORT_SHA"
    paths:
      - build/apk/QuizGate.apk
    expire_in: 14 days
  cache:
    key: android-sdk-34
    paths:
      - .android-sdk/
